<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contabilidad</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2333;--mut:#667085;--br:#d9dde7;--ac:#1f3864;--ok:#1a7f4b;--er:#c0392b;--hd:#eef1f8}
@media(prefers-color-scheme:dark){:root{--bg:#12161f;--card:#1a202c;--tx:#e6e9f0;--mut:#93a0b5;--br:#2c3547;--ac:#7fa3e8;--ok:#4cc38a;--er:#ff6b5e;--hd:#222a3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Arial,Helvetica,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap}
h1{font-size:18px;margin:0;color:var(--ac)}
nav{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--br);overflow-x:auto}
nav button{background:none;border:0;padding:10px 14px;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;font:inherit;white-space:nowrap}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:bold}
main{padding:16px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--br);border-radius:8px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{font:inherit;padding:7px 8px;border:1px solid var(--br);border-radius:6px;background:var(--bg);color:var(--tx);min-width:0}
button{font:inherit;padding:7px 12px;border:1px solid var(--br);border-radius:6px;background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:bold}
button:disabled{opacity:.45;cursor:not-allowed}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--br);text-align:left;vertical-align:middle}
th{background:var(--hd);font-size:12px;color:var(--mut)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#lines input,#lines select{width:100%}
#lines td:nth-child(2),#lines td:nth-child(3){width:130px}
.tot{font-weight:bold;background:var(--hd)}
.ok{color:var(--ok);font-weight:bold}.er{color:var(--er);font-weight:bold}
.b{font-weight:bold}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:8px;color:#fff;display:none;max-width:90%;z-index:9}
dialog{border:1px solid var(--br);border-radius:10px;background:var(--card);color:var(--tx);max-width:460px;width:92%}
dialog label{margin-bottom:10px}
.sep td{border-top:2px solid var(--br)}
</style>
</head>
<body>
<header>
  <h1>Contabilidad · Libro Diario</h1>
  <div class="row"><button id="refresh">↻ Actualizar</button><button id="cfg">⚙ Conexión</button></div>
</header>
<nav id="tabs">
  <button data-t="carga" class="on">Cargar asiento</button>
  <button data-t="diario">Libro Diario</button>
  <button data-t="balance">Sumas y Saldos</button>
  <button data-t="estados">Estados contables</button>
</nav>
<main>
  <section id="t-carga">
    <div class="card">
      <div class="row">
        <label>Fecha<input type="date" id="fecha"></label>
        <label>N° de asiento<input id="nro" readonly size="6"></label>
        <label style="flex:1;min-width:220px">Concepto general (se usa si una línea no tiene detalle)<input id="concepto" placeholder="Ej: Pago alquiler septiembre"></label>
      </div>
    </div>
    <div class="card">
      <div class="w"><table>
        <thead><tr><th>Cuenta</th><th class="n">Debe</th><th class="n">Haber</th><th>Detalle (opcional)</th><th></th></tr></thead>
        <tbody id="lines"></tbody>
        <tfoot><tr class="tot"><td>Totales</td><td class="n" id="td">$ 0</td><td class="n" id="th">$ 0</td><td id="dif" colspan="2"></td></tr></tfoot>
      </table></div>
      <div class="row" style="margin-top:12px">
        <button id="addLine" type="button">+ Agregar línea</button>
        <button id="save" class="pri" type="button" disabled>Guardar asiento</button>
      </div>
    </div>
  </section>
  <section id="t-diario" hidden>
    <div class="card"><label>Filtrar (cuenta, detalle, N° de asiento…)<input id="fil" placeholder="Escribí para filtrar"></label></div>
    <div class="card w"><table id="tb-diario"></table></div>
  </section>
  <section id="t-balance" hidden><div class="card w"><table id="tb-bal"></table></div><div class="card" id="ctrl"></div></section>
  <section id="t-estados" hidden>
    <div class="card w"><h3 style="margin-top:0">Estado de Situación Patrimonial</h3><table id="tb-pat"></table></div>
    <div class="card w"><h3 style="margin-top:0">Estado de Resultados</h3><table id="tb-res"></table></div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="cfgForm">
    <h3 style="margin-top:0">Conexión con Google Sheets</h3>
    <label>URL de la Web App (termina en /exec)<input id="cUrl" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label>Clave (API_KEY del Code.gs)<input id="cKey" type="password"></label>
    <div class="row"><button class="pri" value="ok">Guardar y conectar</button><button value="cancel" formnovalidate>Cancelar</button></div>
    <p style="font-size:12px;color:var(--mut)">Se guardan solo en este navegador; no quedan en el código del repositorio.</p>
  </form>
</dialog>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Number(n) || 0).toLocaleString('es-AR', {style:'currency', currency:'ARS', maximumFractionDigits:2});
const fdate = s => s ? s.split('-').reverse().join('/') : '';
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const num = v => {
  v = String(v || '').trim().replace(/\s|\$/g, '');
  if (!v) return 0;
  if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g, '');
  return parseFloat(v) || 0;
};
let D = null;
const cfg = { url: localStorage.getItem('ct_url') || '', key: localStorage.getItem('ct_key') || '' };

function toast(msg, ok = true) {
  const t = $('#toast');
  t.textContent = msg; t.style.background = ok ? '#1a7f4b' : '#c0392b'; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 4500);
}

async function load() {
  if (!cfg.url || !cfg.key) { $('#dlg').showModal(); return; }
  try {
    const r = await fetch(cfg.url + '?key=' + encodeURIComponent(cfg.key));
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    D = j; render();
  } catch (e) { toast('No se pudo cargar: ' + e.message, false); }
}
async function post(body) {
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ key: cfg.key, ...body }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}

// ---------- Cargar asiento ----------
const opts = () => '<option value="">— cuenta —</option>' +
  D.plan.map(p => `<option value="${esc(p.codigo)}">${esc(p.codigo)} · ${esc(p.cuenta)}</option>`).join('');

function addLine() {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><select class="acc">${opts()}</select></td>
    <td><input class="d" inputmode="decimal" placeholder="0"></td>
    <td><input class="h" inputmode="decimal" placeholder="0"></td>
    <td><input class="t" placeholder="Detalle"></td>
    <td><button type="button" class="x" title="Quitar línea">✕</button></td>`;
  $('#lines').appendChild(tr);
}
function readLines() {
  return [...document.querySelectorAll('#lines tr')].map(tr => ({
    codigo: tr.querySelector('.acc').value,
    debe: num(tr.querySelector('.d').value),
    haber: num(tr.querySelector('.h').value),
    detalle: tr.querySelector('.t').value.trim()
  }));
}
function calc() {
  const L = readLines();
  const td = L.reduce((a, l) => a + l.debe, 0), th = L.reduce((a, l) => a + l.haber, 0);
  const d = Math.round((td - th) * 100) / 100;
  $('#td').textContent = fmt(td); $('#th').textContent = fmt(th);
  $('#dif').innerHTML = d === 0 && td > 0 ? '<span class="ok">✔ El asiento cuadra</span>'
    : `<span class="er">Diferencia: ${fmt(d)}</span>`;
  const valid = L.filter(l => l.codigo && (l.debe > 0) !== (l.haber > 0));
  $('#save').disabled = !(d === 0 && td > 0 && valid.length >= 2 && valid.length === L.length);
}
function resetForm() {
  $('#lines').innerHTML = ''; addLine(); addLine();
  $('#fecha').value = today(); $('#concepto').value = '';
  $('#nro').value = D ? D.nextNro : ''; calc();
}
$('#lines').addEventListener('input', e => {
  const tr = e.target.closest('tr');
  if (e.target.classList.contains('d') && e.target.value) tr.querySelector('.h').value = '';
  if (e.target.classList.contains('h') && e.target.value) tr.querySelector('.d').value = '';
  calc();
});
$('#lines').addEventListener('change', calc);
$('#lines').addEventListener('click', e => {
  if (e.target.classList.contains('x')) { e.target.closest('tr').remove(); calc(); }
});
$('#addLine').onclick = addLine;
$('#save').onclick = async () => {
  $('#save').disabled = true;
  try {
    const j = await post({ action: 'addAsiento', fecha: $('#fecha').value,
      concepto: $('#concepto').value.trim(), lineas: readLines() });
    toast('Asiento N° ' + j.nro + ' guardado (' + j.lineas + ' líneas)');
    await load(); resetForm();
  } catch (e) { toast(e.message, false); calc(); }
};

// ---------- Vistas ----------
function renderDiario() {
  const q = $('#fil').value.toLowerCase();
  let html = '<thead><tr><th>N°</th><th>Fecha</th><th>Cuenta</th><th>Detalle</th><th class="n">Debe</th><th class="n">Haber</th><th></th></tr></thead><tbody>';
  let prev = null;
  D.diario.forEach(r => {
    const txt = [r.nro, r.codigo, r.cuenta, r.detalle].join(' ').toLowerCase();
    if (q && !txt.includes(q)) return;
    const first = r.nro !== prev; prev = r.nro;
    const bad = r.verif !== null && Math.abs(r.verif) > 0.005;
    html += `<tr class="${first ? 'sep' : ''}"><td class="b">${first ? esc(r.nro) : ''}</td><td>${first ? fdate(r.fecha) : ''}</td>
      <td>${esc(r.codigo)} · ${esc(r.cuenta)}</td><td>${esc(r.detalle)}</td>
      <td class="n">${r.debe ? fmt(r.debe) : ''}</td><td class="n">${r.haber ? fmt(r.haber) : ''}</td>
      <td class="n er">${bad ? 'Dif. ' + fmt(r.verif) : ''}</td></tr>`;
  });
  $('#tb-diario').innerHTML = html + '</tbody>';
}
function renderBalance() {
  const b = D.balance, t = b.totales;
  $('#tb-bal').innerHTML = '<thead><tr><th>Código</th><th>Cuenta</th><th class="n">Sumas Debe</th><th class="n">Sumas Haber</th><th class="n">Saldo Deudor</th><th class="n">Saldo Acreedor</th></tr></thead><tbody>' +
    b.rows.map(r => `<tr><td>${esc(r.codigo)}</td><td>${esc(r.cuenta)}</td><td class="n">${fmt(r.debe)}</td><td class="n">${fmt(r.haber)}</td><td class="n">${r.deudor ? fmt(r.deudor) : ''}</td><td class="n">${r.acreedor ? fmt(r.acreedor) : ''}</td></tr>`).join('') +
    `<tr class="tot"><td></td><td>TOTALES</td><td class="n">${fmt(t.debe)}</td><td class="n">${fmt(t.haber)}</td><td class="n">${fmt(t.deudor)}</td><td class="n">${fmt(t.acreedor)}</td></tr></tbody>`;
  const c = x => `<span class="${x === 'OK' ? 'ok' : 'er'}">${esc(x)}</span>`;
  $('#ctrl').innerHTML = `Sumas Debe = Sumas Haber: ${c(b.control1)}<br>Saldo Deudor = Saldo Acreedor: ${c(b.control2)}`;
}
function renderGrid(sel, grid, cols) {
  $(sel).innerHTML = '<tbody>' + grid.filter(r => cols.some(c => String(r[c]).trim() !== '')).map(r => {
    const bold = cols.some(c => { const s = String(r[c]).trim(); return s && (s === s.toUpperCase() && /[A-ZÁÉÍÓÚ]/.test(s) || /^Total/i.test(s)); });
    return '<tr class="' + (bold ? 'tot' : '') + '">' + cols.map((c, i) => `<td class="${i % 2 ? 'n' : ''}">${esc(r[c])}</td>`).join('') + '</tr>';
  }).join('') + '</tbody>';
}
function render() {
  renderDiario(); renderBalance();
  renderGrid('#tb-pat', D.patrimonial, [0, 1, 3, 4]);
  renderGrid('#tb-res', D.resultados, [0, 1]);
  if (!$('#lines').children.length) resetForm(); else $('#nro').value = D.nextNro;
}

// ---------- Eventos ----------
$('#tabs').onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === e.target));
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== 't-' + t);
};
$('#fil').oninput = () => D && renderDiario();
$('#refresh').onclick = load;
$('#cfg').onclick = () => { $('#cUrl').value = cfg.url; $('#cKey').value = cfg.key; $('#dlg').showModal(); };
$('#cfgForm').addEventListener('submit', e => {
  if (e.submitter && e.submitter.value === 'ok') {
    cfg.url = $('#cUrl').value.trim(); cfg.key = $('#cKey').value;
    localStorage.setItem('ct_url', cfg.url); localStorage.setItem('ct_key', cfg.key);
    setTimeout(load, 50);
  }
});
$('#fecha').value = today();
load();
</script>
</body>
</html>
